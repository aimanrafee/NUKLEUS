<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUKLEUS | Innovation Lab</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a0b2e">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cosmos-dark: #1a0b2e; --cosmos-light: #2d1b4d; --atomic-gold: #ffcc00; --stellar-white: #e0d7ff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--cosmos-dark); color: var(--stellar-white); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { position: fixed; left: -260px; top: 0; width: 250px; height: 100%; background: var(--cosmos-light); transition: 0.3s; z-index: 1001; border-right: 2px solid var(--atomic-gold); padding-top: 20px; }
        .sidebar.active { left: 0; }
        .sidebar-item { padding: 15px 25px; cursor: pointer; border-bottom: 1px solid rgba(255,204,0,0.1); display: flex; align-items: center; gap: 15px; }
        .sidebar-item:hover { background: var(--cosmos-dark); color: var(--atomic-gold); }

        /* Header */
        header { background: linear-gradient(135deg, var(--cosmos-dark), var(--cosmos-light)); padding: 15px; display: flex; align-items: center; border-bottom: 2px solid var(--atomic-gold); z-index: 100; }
        .menu-btn { font-size: 1.5rem; cursor: pointer; color: var(--atomic-gold); padding: 5px; }
        header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 3px; color: var(--atomic-gold); flex: 1; text-align: center; text-transform: uppercase; }

        /* Main Content Views */
        .view { display: none; flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .view.active { display: flex; flex-direction: column; }

        /* Chat UI (Sesuai untuk Manual Chat/Note) */
        #chat-box { display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.4; font-size: 0.9rem; }
        .sent { background: linear-gradient(135deg, #4b2c85, #1a0b2e); align-self: flex-end; border: 1px solid var(--atomic-gold); }
        
        /* Dashboard Cards */
        .card { background: var(--cosmos-light); border: 1px solid var(--atomic-gold); border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 15px; }
        .gold-amount { color: var(--atomic-gold); font-size: 1.8rem; font-weight: bold; margin: 10px 0; }

        /* Footer */
        footer { position: fixed; bottom: 0; width: 100%; padding: 15px; background: var(--cosmos-dark); display: flex; gap: 10px; border-top: 1px solid rgba(255,204,0,0.2); }
        input { flex: 1; padding: 12px 20px; background: var(--cosmos-light); border: 1px solid var(--atomic-gold); border-radius: 25px; color: white; outline: none; }
        .send-btn { background: var(--atomic-gold); color: var(--cosmos-dark); border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        /* Overlay */
        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; }
        .overlay.active { display:block; }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="sidebar" id="sidebar">
    <div style="text-align: center; padding: 20px;"><b style="color: var(--atomic-gold)">NUKLEUS LAB</b></div>
    <div class="sidebar-item" onclick="showView('chat')"><i class="fas fa-edit"></i> Nota Peribadi</div>
    <div class="sidebar-item" onclick="showView('staking')"><i class="fas fa-chart-pie"></i> Dashboard ATOM</div>
    <div class="sidebar-item" onclick="showView('kedai')"><i class="fas fa-store"></i> Kedai Management</div>
</div>

<header>
    <i class="fas fa-bars menu-btn" onclick="toggleMenu()"></i>
    <h1 id="page-title">NOTA PERIBADI</h1>
</header>

<div id="chat-view" class="view active">
    <div id="chat-box">
        <div class="msg sent" style="background: var(--cosmos-light); align-self: center; border-color: rgba(255,204,0,0.3);">
            Selamat datang ke Lab Inovasi NUKLEUS. Mula bina ciri baru anda di sini.
        </div>
    </div>
</div>

<div id="staking-view" class="view">
    <div class="card">
        <p>Target Utama</p>
        <div class="gold-amount">1,000,000 ATOM</div>
    </div>
</div>

<div id="kedai-view" class="view">
    <div class="card">
        <p>Target Profit</p>
        <div class="gold-amount">RM 5,000.00</div>
    </div>
</div>
