<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUKLEUS | Core v2.0</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a0b2e">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --cosmos-dark: #1a0b2e; --cosmos-light: #2d1b4d; --atomic-gold: #ffcc00; --stellar-white: #e0d7ff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--cosmos-dark); color: var(--stellar-white); overflow: hidden; }
        
        /* Sidebar Navigation */
        .sidebar { position: fixed; left: -250px; top: 0; width: 250px; height: 100%; background: var(--cosmos-light); transition: 0.3s; z-index: 1001; border-right: 1px solid var(--atomic-gold); padding-top: 60px; }
        .sidebar.active { left: 0; }
        .sidebar-item { padding: 15px 25px; cursor: pointer; border-bottom: 1px solid rgba(255,204,0,0.1); display: flex; align-items: center; gap: 15px; }
        .sidebar-item:hover { background: var(--cosmos-dark); color: var(--atomic-gold); }

        /* Header & Main UI */
        header { background: linear-gradient(135deg, var(--cosmos-dark), var(--cosmos-light)); padding: 15px; display: flex; align-items: center; border-bottom: 2px solid var(--atomic-gold); }
        .menu-btn { font-size: 1.5rem; cursor: pointer; color: var(--atomic-gold); margin-right: 20px; }
        header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 3px; color: var(--atomic-gold); flex: 1; text-align: center; }

        /* Content Area */
        .main-content { height: calc(100vh - 140px); overflow-y: auto; padding: 20px; display: none; }
        .main-content.active { display: flex; flex-direction: column; }

        /* Chat UI */
        #chat-box { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px; border-radius: 15px; max-width: 80%; font-size: 0.9rem; }
        .received { background: var(--cosmos-light); align-self: flex-start; border: 1px solid rgba(255,204,0,0.2); }
        .sent { background: linear-gradient(135deg, #4b2c85, #1a0b2e); align-self: flex-end; border: 1px solid var(--atomic-gold); }

        /* Staking Dashboard UI */
        .card { background: var(--cosmos-light); border: 1px solid var(--atomic-gold); border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .gold-text { color: var(--atomic-gold); font-size: 1.5rem; font-weight: bold; }

        /* Footer */
        footer { position: fixed; bottom: 0; width: 100%; padding: 15px; background: var(--cosmos-dark); display: flex; gap: 10px; box-sizing: border-box; }
        input { flex: 1; padding: 12px; background: var(--cosmos-light); border: 1px solid var(--atomic-gold); border-radius: 25px; color: white; outline: none; }
        button { background: var(--atomic-gold); color: var(--cosmos-dark); border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        /* Overlay */
        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; }
        .overlay.active { display:block; }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-item" onclick="showView('chat')"><i class="fas fa-comments"></i> NUKLEUS Chat</div>
    <div class="sidebar-item" onclick="showView('staking')"><i class="fas fa-chart-line"></i> Staking Tracker</div>
    <div class="sidebar-item" onclick="showView('kedai')"><i class="fas fa-store"></i> Kedai Management</div>
    <div class="sidebar-item" onclick="clearKey()"><i class="fas fa-key"></i> Reset Vault Key</div>
</div>

<header>
    <i class="fas fa-bars menu-btn" onclick="toggleMenu()"></i>
    <h1 id="page-title">NUKLEUS CHAT</h1>
</header>

<div id="chat-view" class="main-content active">
    <div id="chat-box">
        <div class="msg received">Sistem Inteligensi sedia menerima arahan.</div>
    </div>
</div>

<div id="staking-view" class="main-content">
    <div class="card">
        <p>Sasaran Kedaulatan</p>
        <div class="gold-text">1,000,000 ATOM</div>
        <p style="font-size: 0.8rem; opacity: 0.7;">Progress: 0.05% (500 ATOM)</p>
    </div>
    <div class="card" style="border-color: #stellar-white;">
        <p>Reward Mingguan (Est.)</p>
        <div class="gold-text" style="color: #00ff88;">+1.53 ATOM</div>
    </div>
</div>

<div id="kedai-view" class="main-content">
    <div class="card">
        <p>Target Profit Bulanan</p>
        <div class="gold-text">RM 5,000.00</div>
        <p>Modal: RM 50,000</p>
    </div>
</div>

<footer id="chat-footer">
    <input type="text" id="inputMsg" placeholder="Hantar denyutan data...">
    <button onclick="sendToGemini()">Hantar</button>
</footer>

<script>
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function showView(view) {
        document.querySelectorAll('.main-content').forEach(v => v.classList.remove('active'));
        document.getElementById(view + '-view').classList.add('active');
        
        // Sembunyikan footer jika bukan di chat
        document.getElementById('chat-footer').style.display = (view === 'chat') ? 'flex' : 'none';
        
        const titles = { 'chat': 'NUKLEUS CHAT', 'staking': 'STAKING TRACKER', 'kedai': 'KEDAI OPS' };
        document.getElementById('page-title').textContent = titles[view];
        toggleMenu();
    }

    function clearKey() {
        if(confirm("Padam Vault Key dari peranti ini?")) {
            localStorage.removeItem('nukleus_key');
            location.reload();
        }
    }

    // (Gunakan kod sendToGemini sedia ada anda di bawah sini)
    // Sila copy function sendToGemini & appendMessage dari kod sebelumnya ke sini
</script>
</body>
</html>
