<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUKLEUS | The Core of Sovereignty</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a0b2e">
    <style>
        :root {
            --cosmos-dark: #1a0b2e;
            --cosmos-light: #2d1b4d;
            --atomic-gold: #ffcc00;
            --stellar-white: #e0d7ff;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--cosmos-dark);
            color: var(--stellar-white);
        }

        header {
            background: linear-gradient(135deg, var(--cosmos-dark) 0%, var(--cosmos-light) 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--atomic-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: var(--atomic-gold);
            text-transform: uppercase;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: radial-gradient(circle at center, #2d1b4d 0%, #1a0b2e 100%);
        }

        .msg {
            padding: 12px 18px;
            border-radius: 15px;
            max-width: 75%;
            line-height: 1.4;
            font-size: 0.95rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .received {
            background: var(--cosmos-light);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 204, 0, 0.2);
        }

        .sent {
            background: linear-gradient(135deg, #4b2c85 0%, #1a0b2e 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            border: 1px solid var(--atomic-gold);
        }

        footer {
            padding: 15px;
            background: var(--cosmos-dark);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 204, 0, 0.1);
        }

        input {
            flex: 1;
            padding: 12px 20px;
            background: var(--cosmos-light);
            border: 1px solid var(--atomic-gold);
            border-radius: 25px;
            color: white;
            outline: none;
        }

        button {
            background: var(--atomic-gold);
            color: var(--cosmos-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active { transform: scale(0.95); }

        .status-bar {
            font-size: 0.7rem;
            text-align: center;
            padding: 5px;
            background: var(--atomic-gold);
            color: var(--cosmos-dark);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="status-bar">ENCRYPTED ATOMIC NODE ACCESS ACTIVE</div>

<header>
    <h1>NUKLEUS</h1>
</header>

<div id="chat-box">
    <div class="msg received">Selamat datang ke teras kedaulatan anda.</div>
    <div class="msg received">Sistem NUKLEUS sedia untuk komunikasi sulit.</div>
</div>

<footer>
    <input type="text" id="inputMsg" placeholder="Hantar denyutan data...">
    <button onclick="sendMsg()">SEND</button>
</footer>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
        .then(() => console.log("NUKLEUS Core Online"));
    }

    function sendMsg() {
        const input = document.getElementById('inputMsg');
        if (input.value.trim() !== "") {
            const chatBox = document.getElementById('chat-box');
            const newMsg = document.createElement('div');
            newMsg.className = 'msg sent';
            newMsg.textContent = input.value;
            chatBox.appendChild(newMsg);
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }
</script>
</body>
</html>
