<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUKLEUS CORE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --cosmos-dark: #1a0b2e; 
            --cosmos-light: #2d1b4d; 
            --atomic-gold: #ffcc00; 
            --stellar-white: #e0d7ff; 
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background: var(--cosmos-dark); 
            color: var(--stellar-white); 
            height: 100vh; 
            overflow: hidden; 
        }

        /* --- SIDEBAR ALA TELEGRAM --- */
        .sidebar { 
            position: fixed; 
            left: -280px; /* Sembunyi ke kiri */
            top: 0; 
            width: 260px; 
            height: 100%; 
            background: var(--cosmos-light); 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1001; 
            border-right: 1px solid var(--atomic-gold);
            box-shadow: 10px 0 20px rgba(0,0,0,0.5);
        }

        /* Gerakan Smooth */
        .sidebar.active { 
            transform: translateX(280px); 
        }

        .sidebar-header {
            background: linear-gradient(to bottom right, #4b2c85, var(--cosmos-dark));
            padding: 30px 20px;
            text-align: center;
        }

        .sidebar-item { 
            padding: 15px 25px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            transition: 0.2s;
        }

        .sidebar-item:hover { background: rgba(255,204,0,0.1); color: var(--atomic-gold); }

        /* --- HEADER --- */
        header { 
            background: var(--cosmos-dark); 
            padding: 15px; 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,204,0,0.2); 
        }

        .menu-btn { font-size: 1.5rem; cursor: pointer; color: var(--atomic-gold); }
        header h1 { margin: 0 0 0 20px; font-size: 1.1rem; letter-spacing: 2px; flex: 1; }

        /* --- CONTENT VIEWS --- */
        .view { display: none; height: calc(100vh - 70px); overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .view.active { display: block; }

        .card { 
            background: var(--cosmos-light); 
            border-radius: 15px; 
            padding: 20px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(255,204,0,0.2); 
            text-align: center;
        }

        /* --- OVERLAY --- */
        .overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); 
            z-index: 1000; 
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <i class="fas fa-atom fa-3x" style="color: var(--atomic-gold)"></i>
        <div style="margin-top:10px; font-weight:bold;">NUKLEUS PROJECT</div>
    </div>
    <div class="sidebar-item" onclick="showView('chat')"><i class="fas fa-comment"></i> Nota Peribadi</div>
    <div class="sidebar-item" onclick="showView('staking')"><i class="fas fa-chart-line"></i> 1M ATOM Goal</div>
    <div class="sidebar-item" onclick="showView('kedai')"><i class="fas fa-store"></i> Kedai RM50k</div>
</div>

<header>
    <i class="fas fa-bars menu-btn" onclick="toggleMenu()"></i>
    <h1 id="page-title">NOTA PERIBADI</h1>
</header>

<div id="chat-view" class="view active">
    <div class="card">
        <p>Gunakan bahagian ini untuk simpan idea inovasi anda.</p>
    </div>
</div>

<div id="staking-view" class="view">
    <div class="card">
        <h3>SASARAN</h3>
        <h1 style="color:var(--atomic-gold)">1,000,000 ATOM</h1>
        <p>Baki: 999,500 ATOM lagi.</p>
    </div>
</div>

<div id="kedai-view" class="view">
    <div class="card">
        <h3>KEDAI MANAGEMENT</h3>
        <p>Modal: RM 50,000</p>
        <p>Target Profit: RM 5,000/bulan</p>
    </div>
</div>

<script>
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function showView(viewId) {
        // Sembunyikan semua view
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        
        // Tunjukkan view yang dipilih
        document.getElementById(viewId + '-view').classList.add('active');
        
        // Tukar tajuk header
        const titles = { 'chat': 'NOTA PERIBADI', 'staking': '1M ATOM GOAL', 'kedai': 'KEDAI RM50K' };
        document.getElementById('page-title').textContent = titles[viewId];
        
        // Tutup menu
        toggleMenu();
    }
</script>

</body>
</html>
